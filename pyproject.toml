[project]
name = "spotify-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
consumer = [
    "confluent-kafka==2.3.0",
    "psycopg2-binary==2.9.9",
    "sqlalchemy==2.0.30",
    "python-dotenv==1.0.1",
    "tenacity==8.3.0",
]
producer = [
    "spotipy==2.23.0",
    "confluent-kafka==2.3.0",
    "python-dotenv==1.0.1",
    "tenacity==8.3.0",
]
api = [
    "spotipy==2.23.0",
    "fastapi==0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic==2.7.1",
    "httpx==0.27.0",
    "psycopg2-binary==2.9.9",
    "sqlalchemy==2.0.30",
    "prometheus-fastapi-instrumentator==6.1.0",
    "python-dotenv==1.0.1",
    "tenacity==8.3.0",
]
dashboard = [
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.9",
    "spotipy==2.23.0",
    "sqlalchemy>=2.0.30",
    "python-dotenv==1.0.1",
]
orchestration = [
    "prefect>=3.1.0",
    "dbt-core==1.8.0",
    "dbt-postgres==1.8.0",
    "feast[postgres,redis]==0.40.0",
    "mlflow==2.16.2",
    "scikit-learn==1.5.0",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "psycopg2-binary==2.9.9",
    "setuptools",
]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.7",
    "ruff==0.4.4",
    "sqlfluff==3.0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    "integration: tests that interact with external services like Kafka, Postgres etc",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
